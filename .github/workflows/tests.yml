name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install \
            -e packages/y5n-runtime-api \
            -e packages/y5n-runtime-engine \
            -e packages/y5n-runtime-transport \
            -e packages/y5n-runtime-store \
            -e packages/y5n-runtime-llm \
            -e packages/y5n-runtime-boot \
            -e caps/y5n-caps-root
          pip install "git+https://github.com/yakoon-runtime/sdk.git#subdirectory=y5n-sdk-python"
          pip install "git+https://github.com/yakoon-runtime/pack-system.git#subdirectory=y5n-packs-system"
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest packages/y5n-runtime-engine/tests \
                packages/y5n-runtime-store/tests/event \
                packages/y5n-runtime-store/tests/sequence \
                -x --tb=short
