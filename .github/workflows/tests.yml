name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install \
            -e runtime/y5n-runtime-api \
            -e runtime/y5n-runtime-engine \
            -e runtime/y5n-runtime-transport \
            -e runtime/y5n-runtime-store \
            -e runtime/y5n-runtime-llm \
            -e runtime/y5n-runtime-boot \
            -e sdk/y5n-sdk-python \
            -e packs/y5n-packs-root \
            -e packs/y5n-packs-system \
            -e packs/y5n-packs-ident \
            -e packs/y5n-packs-luma \
            -e apps/y5n-apps-yak
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest runtime/y5n-runtime-engine/tests \
                runtime/y5n-runtime-store/tests/event \
                runtime/y5n-runtime-store/tests/sequence \
                packs/y5n-packs-luma/tests \
                apps/y5n-apps-yak/tests \
                -x --tb=short
