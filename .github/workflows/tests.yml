name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install \
            -e packages/runtime-api \
            -e packages/runtime-engine \
            -e packages/runtime-transport \
            -e packages/runtime-store \
            -e packages/runtime-llm \
            -e packages/runtime-boot \
            -e caps/caps-root
          pip install "git+https://github.com/yakoon-runtime/sdk.git#subdirectory=sdk-python"
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest packages/runtime-engine/tests \
                packages/runtime-store/tests/event \
                packages/runtime-store/tests/sequence \
                -x --tb=short
