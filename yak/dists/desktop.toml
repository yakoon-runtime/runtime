name = "desktop"
version = "0.1.0"
description = "Yakoon Desktop — runtime with system tools and interactive world"

[[packs]]
name = "root"

[[packs]]
name = "runtime"

[[packs]]
name = "system"

[[packs]]
name = "luma"

[[mount]]
pack = "root"
target = "/"

[[mount]]
pack = "runtime"
target = "/boot"

[[mount]]
pack = "system"
target = "/usr/bin"

[[mount]]
pack = "luma"
target = "/opt/luma"
